version: "3.9"

services:
  lograke:
    build: .
    container_name: lograke
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      # REQUIRED: generate one with `openssl rand -hex 32` — the container exits on startup without it
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required. Generate one with: openssl rand -hex 32}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5000}
      - AUTH_ENABLED=true
      - ACTIVE_AI_PROVIDER=${ACTIVE_AI_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROK_API_KEY=${GROK_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - lograke_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  lograke_data:
